<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Store Name · Bedsheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#1c2547;--muted:#5b6585;--thread:#d9972b;--line:#c9d2e0;--btn:#1c2547;--btn-text:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121832;--card:#1b2347;--ink:#eaeefb;--muted:#a3adcd;--thread:#f0b34a;--line:#36417a;--btn:#f0b34a;--btn-text:#121832;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:2px dashed var(--thread)}
.brand{font-size:1.25rem;font-weight:800}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--btn);color:var(--btn-text);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
:focus-visible{outline:3px solid var(--thread);outline-offset:2px}
.hero{padding:40px 18px 12px;max-width:960px;margin:0 auto}
.hero h1{font-size:clamp(2rem,7vw,3.4rem);font-weight:800;line-height:1.05}
.hero p{color:var(--muted);max-width:46ch;margin:12px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:24px 18px 48px;max-width:960px;margin:0 auto}
.card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.swatch{aspect-ratio:4/3;position:relative;background-size:cover;background-position:center}
.swatch::after{content:"";position:absolute;inset:10px;border:2px dashed var(--thread);border-radius:6px}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h2{font-size:1.15rem}
.info p{margin:0;color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:auto}
.price{font-weight:700;font-size:1.1rem}
select,input,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.row select{width:auto}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,30,.6)}
.pad{padding:18px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:center}
.line small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.totals{margin:12px 0;display:grid;gap:4px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-weight:800;font-size:1.1rem}
label{display:block;font-weight:600;margin:12px 0 4px}
.pay{display:flex;gap:10px;flex-wrap:wrap}
.pay label{display:flex;gap:8px;align-items:center;font-weight:500;margin:0;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;flex:1}
.pay input{width:auto}
.note{background:var(--bg);border:1.5px dashed var(--thread);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.hidden{display:none}
.empty{color:var(--muted);padding:18px 0}
footer{text-align:center;color:var(--muted);padding:0 18px 32px;font-size:.9rem}
</style>
</head>
<body>

<header>
  <div class="brand" id="brand">Your Store Name</div>
  <button class="btn" id="openCart">Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Bedsheets for every bed</h1>
  <p>Pick a pattern and size, then pay by bKash or cash on delivery.</p>
</section>

<main class="grid" id="grid"></main>
<footer id="foot"></footer>

<dialog id="cart">
  <div class="pad">
    <div class="dh"><h2>Your cart</h2><button class="btn ghost" id="closeCart">Close</button></div>
    <div id="cartBody"></div>
  </div>
</dialog>

<script>
/* ============ EDIT THIS SECTION ============ */
const CONFIG = {
  store: "Haatbari",
  whatsapp: "880+ 01911952466",   // your WhatsApp number, country code first, no + or spaces
  bkash: "880+ 01911952466",     // your bKash personal number shown at checkout
  delivery: 100                 // flat delivery fee in ৳
};

/* To add a bedsheet, copy one block below and change it.
   Use "image" (e.g. "images/rose.jpg") for a real photo, or "pattern" for a colour swatch. */
const PRODUCTS = [
  { id: "indigo-stripe", name: "Indigo Stripe", desc: "Edit this description.",
    prices: { Single: 1250, Double: 1450, King: 1750 },
    pattern: "repeating-linear-gradient(90deg,#2f4a8a 0 14px,#f4f6fb 14px 28px)" },
  { id: "sage-check", name: "Sage Check", desc: "Edit this description.",
    prices: { Single: 1250, Double: 1450, King: 1750 },
    pattern: "conic-gradient(#2f7f79 25%,#e6f1ef 0 50%,#2f7f79 0 75%,#e6f1ef 0) 0 0/36px 36px" },
  { id: "rose-dot", name: "Rose Dot", desc: "Edit this description.",
    prices: { Single: 1300, Double: 1500, King: 1800 },
    pattern: "radial-gradient(#fff 22%,transparent 24%) 0 0/24px 24px,#b4476b" },
  { id: "sky-plain", name: "Sky Plain", desc: "Edit this description.",
    prices: { Single: 1150, Double: 1350, King: 1650 },
    pattern: "linear-gradient(135deg,#8aa4c8,#a9bedc)" },
  { id: "midnight-bloom", name: "Midnight Bloom", desc: "Edit this description.",
    prices: { Single: 1450, Double: 1650, King: 1950 },
    pattern: "radial-gradient(circle at 25% 25%,#f3c969 0 8px,transparent 9px),radial-gradient(circle at 75% 75%,#f3c969 0 8px,transparent 9px),#3b4a82;background-size:40px 40px" }
];
/* ============================================ */

const $ = s => document.querySelector(s);
const money = n => "৳" + n.toLocaleString("en-US");
let cart = [];
try { cart = JSON.parse(localStorage.getItem("cart") || "[]"); } catch (e) {}
const save = () => { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {} };
const prod = id => PRODUCTS.find(p => p.id === id);

$("#brand").textContent = CONFIG.store;
document.title = CONFIG.store + " · Bedsheets";
$("#foot").textContent = "© " + new Date().getFullYear() + " " + CONFIG.store;

function swatchStyle(p) {
  if (p.image) return "background-image:url('" + p.image + "')";
  return p.pattern.includes(";") ? "background:" + p.pattern : "background:" + p.pattern;
}

function renderGrid() {
  $("#grid").innerHTML = PRODUCTS.map(p => {
    const sizes = Object.keys(p.prices);
    return `<article class="card" data-id="${p.id}">
      <div class="swatch" style="${swatchStyle(p)}"></div>
      <div class="info">
        <h2>${p.name}</h2><p>${p.desc}</p>
        <div class="row">
          <select aria-label="Size for ${p.name}">${sizes.map(s => `<option>${s}</option>`).join("")}</select>
          <span class="price">${money(p.prices[sizes[0]])}</span>
        </div>
        <button class="btn add">Add to cart</button>
      </div></article>`;
  }).join("");
}

$("#grid").addEventListener("change", e => {
  if (e.target.tagName !== "SELECT") return;
  const card = e.target.closest(".card");
  card.querySelector(".price").textContent = money(prod(card.dataset.id).prices[e.target.value]);
});

$("#grid").addEventListener("click", e => {
  if (!e.target.classList.contains("add")) return;
  const card = e.target.closest(".card");
  const id = card.dataset.id, size = card.querySelector("select").value;
  const hit = cart.find(i => i.id === id && i.size === size);
  hit ? hit.qty++ : cart.push({ id, size, qty: 1 });
  save(); updateCount();
  e.target.textContent = "Added ✓";
  setTimeout(() => e.target.textContent = "Add to cart", 1000);
});

function updateCount() { $("#count").textContent = cart.reduce((n, i) => n + i.qty, 0); }
const subtotal = () => cart.reduce((n, i) => n + prod(i.id).prices[i.size] * i.qty, 0);

function renderCart() {
  const body = $("#cartBody");
  if (!cart.length) { body.innerHTML = '<p class="empty">Your cart is empty.</p>'; return; }
  const sub = subtotal(), total = sub + CONFIG.delivery;
  body.innerHTML = cart.map((i, k) => {
    const p = prod(i.id);
    return `<div class="line"><div>${p.name}<br><small>${i.size} · ${money(p.prices[i.size])}</small></div>
      <div class="qty"><button data-k="${k}" data-d="-1" aria-label="Remove one">−</button><span>${i.qty}</span><button data-k="${k}" data-d="1" aria-label="Add one">+</button></div></div>`;
  }).join("") + `
  <div class="totals"><div><span>Subtotal</span><span>${money(sub)}</span></div>
    <div><span>Delivery</span><span>${money(CONFIG.delivery)}</span></div>
    <div class="grand"><span>Total</span><span>${money(total)}</span></div></div>
  <form id="order">
    <label for="name">Full name</label><input id="name" required autocomplete="name">
    <label for="phone">Phone number</label><input id="phone" type="tel" required autocomplete="tel">
    <label for="addr">Delivery address</label><textarea id="addr" rows="3" required autocomplete="street-address"></textarea>
    <label>Payment</label>
    <div class="pay">
      <label><input type="radio" name="pay" value="bkash" checked> bKash</label>
      <label><input type="radio" name="pay" value="cod"> Cash on delivery</label>
    </div>
    <div class="note" id="bkashBox">Send <b>${money(total)}</b> to bKash <b>${CONFIG.bkash}</b> using Send Money, then enter the transaction ID below.
      <label for="trx">bKash transaction ID</label><input id="trx" autocapitalize="characters" autocomplete="off"></div>
    <button class="btn" style="width:100%;margin-top:16px" type="submit">Place order on WhatsApp</button>
  </form>`;
}

$("#cartBody").addEventListener("click", e => {
  const k = e.target.dataset.k; if (k === undefined) return;
  cart[k].qty += Number(e.target.dataset.d);
  if (cart[k].qty < 1) cart.splice(k, 1);
  save(); updateCount(); renderCart();
});

$("#cartBody").addEventListener("change", e => {
  if (e.target.name !== "pay") return;
  const bk = e.target.value === "bkash";
  $("#bkashBox").classList.toggle("hidden", !bk);
  $("#trx").required = bk;
});

$("#cartBody").addEventListener("submit", e => {
  e.preventDefault();
  const pay = document.querySelector('input[name="pay"]:checked').value;
  const trx = $("#trx").value.trim();
  if (pay === "bkash" && !trx) { $("#trx").focus(); return; }
  const total = subtotal() + CONFIG.delivery;
  const lines = cart.map(i => `- ${prod(i.id).name} (${i.size}) x${i.qty} = ${money(prod(i.id).prices[i.size] * i.qty)}`);
  const msg = [`New order – ${CONFIG.store}`, `Name: ${$("#name").value}`, `Phone: ${$("#phone").value}`,
    `Address: ${$("#addr").value}`, "Items:", ...lines, `Delivery: ${money(CONFIG.delivery)}`, `Total: ${money(total)}`,
    pay === "bkash" ? `Payment: bKash, TrxID ${trx}` : "Payment: Cash on delivery"].join("\n");
  const url = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg);
  cart = []; save(); updateCount();
  $("#cartBody").innerHTML = `<p>Your order is ready. Send the WhatsApp message to confirm it.</p>
    <p><a class="btn" style="display:inline-block;text-decoration:none" href="${url}">Open WhatsApp</a></p>`;
  window.location.href = url;
});

$("#openCart").onclick = () => { renderCart(); $("#cart").showModal(); };
$("#closeCart").onclick = () => $("#cart").close();
renderGrid(); updateCount();
</script>
</body>
</html>
